<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ivan Rodriguez profile banner</title>
  <desc id="desc">A banner highlighting quant systems, economic AI, public data, and product engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="48" y1="36" x2="1232" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#11243E"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F243A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0A1727" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="1264" height="404" rx="28" fill="url(#bg)"/>
  <rect x="8" y="8" width="1264" height="404" rx="28" fill="url(#grid)" opacity="0.22"/>
  <rect x="8.5" y="8.5" width="1263" height="403" rx="27.5" stroke="#1E293B"/>

  <circle cx="1110" cy="82" r="86" fill="#0F766E" opacity="0.16"/>
  <circle cx="1018" cy="152" r="128" fill="#1D4ED8" opacity="0.12"/>
  <circle cx="1188" cy="314" r="104" fill="#0891B2" opacity="0.08"/>

  <g opacity="0.95">
    <text x="74" y="78" fill="#93C5FD" font-size="16" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2.8">IVAN RODRIGUEZ</text>
    <text x="74" y="136" fill="white" font-size="44" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Economics x Data x</text>
    <text x="74" y="188" fill="white" font-size="44" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Intelligent Systems</text>
    <rect x="74" y="210" width="160" height="6" rx="3" fill="url(#accent)" filter="url(#glow)"/>
    <text x="74" y="258" fill="#CBD5E1" font-size="22" font-family="Segoe UI, Arial, sans-serif">Building quant research tools, grounded AI products,</text>
    <text x="74" y="290" fill="#CBD5E1" font-size="22" font-family="Segoe UI, Arial, sans-serif">and decision-ready data applications from Argentina.</text>
  </g>

  <g>
    <rect x="74" y="326" width="168" height="38" rx="19" fill="#0B1B2D" stroke="#1F3A5B"/>
    <text x="100" y="350" fill="#E2E8F0" font-size="16" font-family="Segoe UI, Arial, sans-serif">Quant Systems</text>

    <rect x="258" y="326" width="156" height="38" rx="19" fill="#0B1B2D" stroke="#1F3A5B"/>
    <text x="290" y="350" fill="#E2E8F0" font-size="16" font-family="Segoe UI, Arial, sans-serif">Economic AI</text>

    <rect x="430" y="326" width="152" height="38" rx="19" fill="#0B1B2D" stroke="#1F3A5B"/>
    <text x="463" y="350" fill="#E2E8F0" font-size="16" font-family="Segoe UI, Arial, sans-serif">Public Data</text>
  </g>

  <g>
    <rect x="760" y="64" width="434" height="88" rx="22" fill="url(#card)" stroke="#1E3A5F"/>
    <circle cx="798" cy="108" r="8" fill="#2DD4BF"/>
    <text x="820" y="101" fill="white" font-size="22" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Quant Systems</text>
    <text x="820" y="130" fill="#CBD5E1" font-size="16" font-family="Segoe UI, Arial, sans-serif">Backtesting frameworks, walk-forward evaluation,</text>
    <text x="820" y="151" fill="#CBD5E1" font-size="16" font-family="Segoe UI, Arial, sans-serif">portfolio construction, and statistical arbitrage research.</text>

    <rect x="760" y="166" width="434" height="88" rx="22" fill="url(#card)" stroke="#1E3A5F"/>
    <circle cx="798" cy="210" r="8" fill="#60A5FA"/>
    <text x="820" y="203" fill="white" font-size="22" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Economic AI</text>
    <text x="820" y="232" fill="#CBD5E1" font-size="16" font-family="Segoe UI, Arial, sans-serif">Voice and chat interfaces over real indicators,</text>
    <text x="820" y="253" fill="#CBD5E1" font-size="16" font-family="Segoe UI, Arial, sans-serif">LLM routing, MCP data access, and controlled SQL generation.</text>

    <rect x="760" y="268" width="434" height="88" rx="22" fill="url(#card)" stroke="#1E3A5F"/>
    <circle cx="798" cy="312" r="8" fill="#F59E0B"/>
    <text x="820" y="305" fill="white" font-size="22" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Product Engineering</text>
    <text x="820" y="334" fill="#CBD5E1" font-size="16" font-family="Segoe UI, Arial, sans-serif">From dashboards to SaaS MVPs with strong data foundations,</text>
    <text x="820" y="355" fill="#CBD5E1" font-size="16" font-family="Segoe UI, Arial, sans-serif">using React, Next.js, NestJS, Prisma, and PostgreSQL.</text>
  </g>
</svg>
