<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ivan Rodriguez profile banner</title>
  <desc id="desc">A banner highlighting public AI systems, quant research, and economic data products.</desc>
  <defs>
    <linearGradient id="bg" x1="48" y1="36" x2="1232" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#11243E"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F243A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0A1727" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="1264" height="404" rx="28" fill="url(#bg)"/>
  <rect x="8" y="8" width="1264" height="404" rx="28" fill="url(#grid)" opacity="0.22"/>
  <rect x="8.5" y="8.5" width="1263" height="403" rx="27.5" stroke="#1E293B"/>

  <circle cx="1110" cy="82" r="86" fill="#0F766E" opacity="0.16"/>
  <circle cx="1018" cy="152" r="128" fill="#1D4ED8" opacity="0.12"/>
  <circle cx="1188" cy="314" r="104" fill="#0891B2" opacity="0.08"/>

  <g opacity="0.95">
    <text x="74" y="78" fill="#93C5FD" font-size="16" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2.4">DATA SCIENTIST | AI LEAD | ML RESEARCHER</text>
    <text x="74" y="136" fill="white" font-size="44" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Economics x AI x</text>
    <text x="74" y="188" fill="white" font-size="44" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Quant Systems</text>
    <rect x="74" y="210" width="160" height="6" rx="3" fill="url(#accent)" filter="url(#glow)"/>
    <text x="74" y="258" fill="#CBD5E1" font-size="22" font-family="Segoe UI, Arial, sans-serif">Building public AI systems, quant research tools,</text>
    <text x="74" y="290" fill="#CBD5E1" font-size="22" font-family="Segoe UI, Arial, sans-serif">and economic intelligence products from Argentina.</text>
  </g>

  <g>
    <rect x="74" y="326" width="136" height="38" rx="19" fill="#0B1B2D" stroke="#1F3A5B"/>
    <text x="103" y="350" fill="#E2E8F0" font-size="16" font-family="Segoe UI, Arial, sans-serif">Public AI</text>

    <rect x="226" y="326" width="160" height="38" rx="19" fill="#0B1B2D" stroke="#1F3A5B"/>
    <text x="255" y="350" fill="#E2E8F0" font-size="16" font-family="Segoe UI, Arial, sans-serif">Quant Research</text>

    <rect x="402" y="326" width="208" height="38" rx="19" fill="#0B1B2D" stroke="#1F3A5B"/>
    <text x="431" y="350" fill="#E2E8F0" font-size="16" font-family="Segoe UI, Arial, sans-serif">Economic Data Products</text>
  </g>

  <g>
    <rect x="760" y="64" width="434" height="88" rx="22" fill="url(#card)" stroke="#1E3A5F"/>
    <circle cx="798" cy="108" r="8" fill="#2DD4BF"/>
    <text x="820" y="101" fill="white" font-size="22" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Public AI Systems</text>
    <text x="820" y="130" fill="#CBD5E1" font-size="16" font-family="Segoe UI, Arial, sans-serif">Local LLMs, MCP architectures, workflow automation,</text>
    <text x="820" y="151" fill="#CBD5E1" font-size="16" font-family="Segoe UI, Arial, sans-serif">and document intelligence for provincial governance.</text>

    <rect x="760" y="166" width="434" height="88" rx="22" fill="url(#card)" stroke="#1E3A5F"/>
    <circle cx="798" cy="210" r="8" fill="#60A5FA"/>
    <text x="820" y="203" fill="white" font-size="22" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Quant Research</text>
    <text x="820" y="232" fill="#CBD5E1" font-size="16" font-family="Segoe UI, Arial, sans-serif">Cointegration, walk-forward evaluation, Z-scores,</text>
    <text x="820" y="253" fill="#CBD5E1" font-size="16" font-family="Segoe UI, Arial, sans-serif">backtesting, and statistical arbitrage experimentation.</text>

    <rect x="760" y="268" width="434" height="88" rx="22" fill="url(#card)" stroke="#1E3A5F"/>
    <circle cx="798" cy="312" r="8" fill="#F59E0B"/>
    <text x="820" y="305" fill="white" font-size="22" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Economic Data Products</text>
    <text x="820" y="334" fill="#CBD5E1" font-size="16" font-family="Segoe UI, Arial, sans-serif">Forecasting, ETL pipelines, indicator systems, and dashboards</text>
    <text x="820" y="355" fill="#CBD5E1" font-size="16" font-family="Segoe UI, Arial, sans-serif">for institutions that need decision-ready economic data.</text>
  </g>
</svg>
